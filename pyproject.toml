[project]
name = "fxlab"
version = "0.1.0"
description = "EUR/USD trading assistant: technical analysis, news analysis and a combined signal"
readme = "README.md"
authors = [
    { name = "Mursyid Hassan", email = "290976846+Moosesid@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
